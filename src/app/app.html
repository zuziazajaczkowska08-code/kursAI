<h1>Mój pierwszy formularz</h1>
<form (ngSubmit)="wyslij()">
  <label for="imie"> Podaj imię:</label>
  <input type="text" name="imie" id="imie" [(ngModel)]="imie" required minlength="3">
  <label for="">Podaj nazwisko:<input type="text" name="nazwisko" id="nazwisko" [(ngModel)]="nazwisko"></label>
  <label for="">Podaj wiek:<input type="number" name="wiek" id="wiek" [(ngModel)]="wiek"></label>
  <button type="submit" [disabled] = "!imie">Wyślij</button>

</form>
<p *ngIf="!imie">Wpisz swoje imię!</p>
<p *ngIf="wyslano">
  Twoje imię to: {{ zapisaneImie}}, nazwisko: {{ zapisaneNazwisko }}, wiek: {{ zapisaneWiek }} lat.
</p>

<p *ngIf="imie.length > 0 && imie.length < 3">
  Imię musi mieć co najmniej 3 znaki!
</p>
